version: '3.8'

services:
  booking-recognizer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-recognizer-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # PaddleOCR 集成(见 paddle-service/):Node 端通过容器 DNS 访问 Python 服务
      - PADDLE_OCR_URL=http://paddleocr:8866/ocr
      - PADDLE_TIMEOUT_MS=90000
      - PADDLE_ENABLED=true
      - PADDLE_MAX_CONCURRENCY=4
    volumes:
      - booking-uploads:/app/uploads
    depends_on:
      paddleocr:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  paddleocr:
    build:
      context: ./paddle-service
      dockerfile: Dockerfile
    image: booking-recognizer/paddleocr:1.0.0
    container_name: booking-recognizer-paddleocr
    expose:
      - "8866"   # 容器内暴露,Node 通过内部 DNS 访问,不映射到主机
    environment:
      - PADDLE_LANG=ch
      - PADDLE_USE_GPU=false
      - LOG_LEVEL=INFO
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8866/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s   # PaddleOCR 模型首次加载预留 2 分钟
    volumes:
      - paddle-models:/root/.paddleocr   # 持久化模型缓存,避免重启重下

volumes:
  booking-uploads:
  paddle-models: